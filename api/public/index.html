<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JMeter Demo — Panel de pruebas</title>
<style>
  :root {
    --bg: #0b0d13;
    --bg-grid: rgba(255,255,255,0.02);
    --panel: #14161f;
    --panel-2: #191c27;
    --border: #262a38;
    --border-soft: #1d2029;
    --text: #e9ebf2;
    --dim: #8890a4;
    --dim-2: #5c6479;
    --green: #34d399;
    --green-bg: rgba(52,211,153,0.12);
    --yellow: #fbbf24;
    --yellow-bg: rgba(251,191,36,0.12);
    --red: #f87171;
    --red-bg: rgba(248,113,113,0.12);
    --blue: #6d8dfd;
    --blue-soft: rgba(109,141,253,0.12);
    --purple: #a78bfa;
    --radius: 14px;
    --shadow: 0 8px 24px rgba(0,0,0,0.28);
  }

  * { box-sizing: border-box; }

  body {
    background:
      radial-gradient(circle at 15% 0%, rgba(109,141,253,0.06), transparent 40%),
      radial-gradient(circle at 85% 100%, rgba(167,139,250,0.05), transparent 45%),
      var(--bg);
    color: var(--text);
    font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
    margin: 0;
    padding: 2.5rem 2rem;
    min-height: 100vh;
  }

  .wrap { max-width: 960px; margin: 0 auto; }

  header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 1rem;
    margin-bottom: 1.75rem;
  }

  .title-group { display: flex; align-items: center; gap: 0.85rem; }

  .logo {
    width: 40px; height: 40px;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(145deg, var(--blue), var(--purple));
    border-radius: 11px;
    box-shadow: 0 4px 14px rgba(109,141,253,0.35);
    flex-shrink: 0;
  }

  h1 {
    font-size: 1.35rem;
    font-weight: 650;
    margin: 0;
    letter-spacing: -0.01em;
  }

  .subtitle {
    color: var(--dim);
    margin-top: 0.2rem;
    font-size: 0.88rem;
  }

  .env-tag {
    font-size: 0.72rem;
    color: var(--dim);
    border: 1px solid var(--border);
    background: var(--panel);
    padding: 5px 11px;
    border-radius: 20px;
    display: flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
    margin-top: 4px;
  }

  .env-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 0 3px var(--green-bg);
  }

  /* ---- status bar ---- */
  .status-bar {
    display: flex;
    align-items: center;
    gap: 1.25rem;
    background: linear-gradient(180deg, var(--panel-2), var(--panel));
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.1rem 1.4rem;
    margin-bottom: 1.5rem;
    box-shadow: var(--shadow);
  }

  .status-label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--text);
    white-space: nowrap;
  }

  .slots { display: flex; gap: 6px; }

  .slot {
    width: 20px; height: 20px;
    border-radius: 6px;
    background: #1f2230;
    border: 1px solid var(--border-soft);
    transition: background 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
  }

  .slot.on {
    background: var(--blue);
    border-color: var(--blue);
    box-shadow: 0 0 10px rgba(109,141,253,0.55);
  }

  .status-text {
    color: var(--dim);
    font-size: 0.82rem;
    margin-left: auto;
    font-variant-numeric: tabular-nums;
  }

  /* ---- buttons ---- */
  .buttons {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
    gap: 0.75rem;
    margin-bottom: 1.5rem;
  }

  button {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 1rem 1.05rem;
    border-radius: 12px;
    cursor: pointer;
    font-size: 0.92rem;
    font-family: inherit;
    text-align: left;
    display: flex;
    flex-direction: column;
    gap: 8px;
    transition: transform 0.12s ease, border-color 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
  }

  button:hover {
    border-color: var(--blue);
    background: var(--panel-2);
    box-shadow: 0 6px 18px rgba(0,0,0,0.3);
  }

  button:active { transform: scale(0.97); }

  button .icon-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 600;
  }

  button .icon-row svg { flex-shrink: 0; }

  button .desc {
    color: var(--dim);
    font-size: 0.76rem;
    font-weight: 400;
  }

  button.accent-green .icon-row svg { color: var(--green); }
  button.accent-blue .icon-row svg { color: var(--blue); }
  button.accent-yellow .icon-row svg { color: var(--yellow); }
  button.accent-red .icon-row svg { color: var(--red); }
  button.accent-purple .icon-row svg { color: var(--purple); }

  /* ---- log panel ---- */
  .log-panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow);
  }

  .log-header {
    padding: 0.9rem 1.3rem;
    border-bottom: 1px solid var(--border);
    font-size: 0.84rem;
    color: var(--dim);
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--panel-2);
  }

  .log-header .title {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--text);
    font-weight: 600;
  }

  #counter { font-variant-numeric: tabular-nums; }

  .log-list {
    max-height: 420px;
    overflow-y: auto;
    display: flex;
    flex-direction: column-reverse;
  }

  .log-list::-webkit-scrollbar { width: 8px; }
  .log-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 8px; }
  .log-list::-webkit-scrollbar-track { background: transparent; }

  .log-empty {
    padding: 2.5rem 1.3rem;
    text-align: center;
    color: var(--dim-2);
    font-size: 0.85rem;
  }

  .log-item {
    padding: 0.8rem 1.3rem;
    border-bottom: 1px solid var(--border-soft);
    display: flex;
    align-items: center;
    gap: 0.9rem;
    font-size: 0.85rem;
    animation: slideIn 0.2s ease;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .badge {
    font-size: 0.7rem;
    font-weight: 650;
    padding: 3px 10px;
    border-radius: 20px;
    min-width: 68px;
    text-align: center;
    letter-spacing: 0.01em;
  }

  .badge.pending { background: #232635; color: var(--dim); }
  .badge.ok { background: var(--green-bg); color: var(--green); }
  .badge.warn { background: var(--yellow-bg); color: var(--yellow); }
  .badge.err { background: var(--red-bg); color: var(--red); }

  .log-endpoint { font-weight: 600; }

  .log-meta {
    color: var(--dim);
    margin-left: auto;
    font-variant-numeric: tabular-nums;
    font-size: 0.8rem;
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="title-group">
      <div class="logo">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <path d="M4 17L10 11L14 15L20 7" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M14 7H20V13" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div>
        <h1>Panel de pruebas — JMeter Demo</h1>
        <div class="subtitle">Presioná un botón para enviar una solicitud real a la API y ver la respuesta en vivo.</div>
      </div>
    </div>
    <div class="env-tag"><span class="env-dot"></span> local</div>
  </header>

  <div class="status-bar">
    <div class="status-label">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
        <rect x="3" y="3" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="2"/>
        <rect x="14" y="3" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="2"/>
        <rect x="3" y="14" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="2"/>
        <rect x="14" y="14" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="2"/>
      </svg>
      Cupo del servidor
    </div>
    <div class="slots" id="slots"></div>
    <span class="status-text" id="statusText">conectando...</span>
  </div>

  <div class="buttons">
    <button class="accent-green" onclick="disparar('/health', 'GET', 'Liviana')">
      <span class="icon-row">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 12L9 17L20 6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        /health
      </span>
      <span class="desc">Caso feliz, siempre rápida</span>
    </button>

    <button class="accent-blue" onclick="disparar('/users', 'GET', 'Con datos')">
      <span class="icon-row">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 6H20M4 12H20M4 18H14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
        /users
      </span>
      <span class="desc">Lista con body JSON</span>
    </button>

    <button class="accent-yellow" onclick="disparar('/slow?ms=2000', 'GET', 'Lenta')">
      <span class="icon-row">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="2.1"/><path d="M12 7.5V12L15 14" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/></svg>
        /slow
      </span>
      <span class="desc">2 segundos de espera</span>
    </button>

    <button class="accent-red" onclick="disparar('/error', 'GET', 'Rota')">
      <span class="icon-row">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="2.1"/><path d="M9 9L15 15M15 9L9 15" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/></svg>
        /error
      </span>
      <span class="desc">Siempre falla (500)</span>
    </button>

    <button class="accent-red" onclick="disparar('/heavy?n=35', 'GET', 'Pesada')">
      <span class="icon-row">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 3C12 3 7 8.5 7 13.5C7 17 9.5 19 12 19C14.5 19 17 17 17 13.5C17 12.7 16.8 11.9 16.5 11.1C15.8 12 14.7 12.5 14.7 12.5C15 10 13 7.5 12 3Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
        /heavy
      </span>
      <span class="desc">Bloquea el servidor</span>
    </button>

    <button class="accent-purple" onclick="rafaga()">
      <span class="icon-row">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M13 2L4 14H11L10 22L20 9H13L13 2Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
        Ráfaga x10
      </span>
      <span class="desc">Dispara 10 solicitudes a la vez</span>
    </button>
  </div>

  <div class="log-panel">
    <div class="log-header">
      <span class="title">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M4 4H20V20H4V4Z" stroke="currentColor" stroke-width="2"/><path d="M8 9H16M8 13H16M8 17H12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        Actividad en vivo
      </span>
      <span id="counter">0 solicitudes</span>
    </div>
    <div class="log-list" id="logList"></div>
  </div>

</div>

<script>
// Estado global del panel
let contador = 0;
const logList = document.getElementById('logList');

function mostrarVacioSiCorresponde() {
  if (contador === 0 && !logList.querySelector('.log-item')) {
    logList.innerHTML = '<div class="log-empty">Todavía no se enviaron solicitudes</div>';
  }
}

function agregarLog(endpoint) {
  const vacio = logList.querySelector('.log-empty');
  if (vacio) vacio.remove();

  contador++;
  document.getElementById('counter').textContent = contador + ' solicitudes';

  const id = 'req-' + contador;
  const item = document.createElement('div');
  item.className = 'log-item';
  item.id = id;
  item.innerHTML = `
    <span class="badge pending">enviando</span>
    <span class="log-endpoint">${endpoint}</span>
    <span class="log-meta"></span>
  `;
  logList.prepend(item);
  return id;
}

function actualizarLog(id, badgeClass, badgeText, meta) {
  const item = document.getElementById(id);
  if (!item) return;
  const badge = item.querySelector('.badge');
  badge.className = 'badge ' + badgeClass;
  badge.textContent = badgeText;
  item.querySelector('.log-meta').textContent = meta;
}

async function disparar(path, method, etiqueta) {
  const logId = agregarLog(etiqueta + ' (' + path + ')');
  const inicio = performance.now();
  try {
    const res = await fetch(path, { method });
    const ms = Math.round(performance.now() - inicio);
    let clase = 'ok', texto = res.status + ' OK';
    if (res.status === 429) { clase = 'warn'; texto = '429 rechazada'; }
    else if (res.status === 503) { clase = 'err'; texto = '503 timeout'; }
    else if (res.status >= 500) { clase = 'err'; texto = res.status + ' error'; }
    else if (res.status >= 400) { clase = 'warn'; texto = res.status; }
    actualizarLog(logId, clase, texto, ms + 'ms');
  } catch (e) {
    const ms = Math.round(performance.now() - inicio);
    actualizarLog(logId, 'err', 'sin conexión', ms + 'ms');
  }
}

function rafaga() {
  for (let i = 0; i < 10; i++) {
    disparar('/heavy?n=32', 'GET', 'Ráfaga #' + (i + 1));
  }
}

// Consulta periódica del cupo del servidor
async function actualizarCupo() {
  try {
    const res = await fetch('/status');
    const data = await res.json();
    const slotsEl = document.getElementById('slots');
    slotsEl.innerHTML = '';
    for (let i = 0; i < data.max; i++) {
      const slot = document.createElement('div');
      slot.className = 'slot' + (i < data.activeRequests ? ' on' : '');
      slotsEl.appendChild(slot);
    }
    document.getElementById('statusText').textContent = `${data.activeRequests} / ${data.max} en uso`;
  } catch (e) {
    document.getElementById('statusText').textContent = 'API no responde';
  }
}

mostrarVacioSiCorresponde();
setInterval(actualizarCupo, 400);
actualizarCupo();
</script>
</body>
</html>
