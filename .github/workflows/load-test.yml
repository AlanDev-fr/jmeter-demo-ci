name: Prueba de carga con JMeter

on:
  pull_request:
    branches: [main]

env:
  JMETER_VERSION: "5.6.3"
  # Umbrales de aceptación: si se superan, el job falla y bloquea el PR
  MAX_ERROR_PCT: "5"
  MAX_MEAN_RES_TIME_MS: "1500"

jobs:
  load-test:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Configurar Java (requerido por JMeter)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Instalar dependencias de la API
        working-directory: ./api
        run: npm ci

      - name: Levantar la API en segundo plano
        working-directory: ./api
        run: |
          nohup npm start > server.log 2>&1 &
          echo "Esperando a que la API responda..."
          for i in $(seq 1 20); do
            if curl -sf http://localhost:3000/health > /dev/null; then
              echo "API lista."
              exit 0
            fi
            sleep 1
          done
          echo "La API no respondió a tiempo."
          cat server.log
          exit 1

      - name: Descargar e instalar JMeter
        run: |
          wget -q https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-${JMETER_VERSION}.tgz
          tar -xzf apache-jmeter-${JMETER_VERSION}.tgz
          echo "$PWD/apache-jmeter-${JMETER_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Ejecutar el plan de pruebas (modo consola)
        run: |
          jmeter -n -t demo-test-plan.jmx -l resultado.jtl -e -o reporte

      - name: Evaluar umbrales de rendimiento
        run: |
          ERROR_PCT=$(jq '.Total.errorPct' reporte/statistics.json)
          MEAN_TIME=$(jq '.Total.meanResTime' reporte/statistics.json)

          echo "## Resultado de la prueba de carga" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Métrica | Valor | Umbral |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| % de error | ${ERROR_PCT}% | ${MAX_ERROR_PCT}% |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Tiempo de respuesta promedio | ${MEAN_TIME} ms | ${MAX_MEAN_RES_TIME_MS} ms |" >> "$GITHUB_STEP_SUMMARY"

          FALLA=0
          if (( $(echo "$ERROR_PCT > $MAX_ERROR_PCT" | bc -l) )); then
            echo "❌ El porcentaje de error supera el umbral permitido." >> "$GITHUB_STEP_SUMMARY"
            FALLA=1
          fi
          if (( $(echo "$MEAN_TIME > $MAX_MEAN_RES_TIME_MS" | bc -l) )); then
            echo "❌ El tiempo de respuesta promedio supera el umbral permitido." >> "$GITHUB_STEP_SUMMARY"
            FALLA=1
          fi
          if [ "$FALLA" -eq 0 ]; then
            echo "✅ La prueba de carga pasó los umbrales definidos." >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $FALLA

      - name: Publicar el reporte HTML como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-jmeter
          path: reporte/
          retention-days: 14